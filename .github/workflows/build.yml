
name: Build Text APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget \
            openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf automake autopoint gettext \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            build-essential patch

      - name: Install Buildozer
        run: |
          python -m pip install --user --upgrade pip
          python -m pip install --user \
            buildozer \
            cython==0.29.36 \
            virtualenv

      - name: Build with Buildozer
        shell: bash
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug 2>&1 | tee build.log

      
      
      
      
      - name: Extract exact compiler failure
        if: always()
        run: |
          n=$(grep -n 'returned non-zero exit status 1' build.log | tail -n 1 | cut -d: -f1)
          if [ -n "$n" ]; then
            start=$((n-45))
            echo "===== EXACT FAILURE AREA ====="
            sed -n "${start},${n}p" build.log
          else
            echo "Failure marker not found"
            tail -n 50 build.log
          fi





      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Football-Manager-APK
          path: bin/*.apk
          if-no-files-found: error
