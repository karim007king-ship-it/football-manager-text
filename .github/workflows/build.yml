name: Build Text APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget \
            openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf automake autopoint gettext \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            build-essential patch

      - name: Install Buildozer
        run: |
          python -m pip install --user --upgrade pip
          python -m pip install --user \
            buildozer \
            cython==0.29.36 \
            virtualenv

      - name: Build with Buildozer
        shell: bash
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug 2>&1 | tee build.log

      - name: Find real compiler errors
        if: always()
        run: |
          echo "===== COMPILER ERRORS ====="
          grep -n -i -E 'error:|fatal error:|undefined reference|killed|no such file|cgl_gl.c:' build.log | tail -n 60 || true

          echo "===== CGL GL REFERENCES ====="
          grep -n -B 8 -A 12 'cgl_gl.c' build.log | tail -n 100 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Football-Manager-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
